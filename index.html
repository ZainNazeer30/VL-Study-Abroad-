    <!-- Speed. The browser is told about the font and image servers before it needs them, and the
         home page photo is fetched at the same time as the stylesheet rather than after it. That
         photo is the largest thing on the first screen, so how quickly it appears is literally one
         of the three scores Google measures a page on. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/img/hero-students-1024.webp"
      imagesrcset="/img/hero-students-640.webp 640w, /img/hero-students-1024.webp 1024w, /img/hero-students-1600.webp 1600w, /img/hero-students-2000.webp 2000w"
      imagesizes="(min-width: 1024px) 50vw, 100vw"
      fetchpriority="high"
    />
    <!-- The fonts, loaded without blocking the first paint.
         Before this, the browser hit this stylesheet, stopped, opened a connection to a second
         company's server, waited for the file and only then drew anything. On a phone on mobile
         data in Pakistan that is a few hundred milliseconds of blank screen on every page, and
         it lands on First Contentful Paint and Largest Contentful Paint, two of the three scores
         Google grades a page on.
         The trick below is standard: ask for it as a print stylesheet, which the browser fetches
         without blocking, then flip it to all media once it has arrived. The <noscript> copy
         covers the small number of visitors with JavaScript off. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Google Analytics, with consent switched OFF until the visitor agrees.
         =========================================================================================
         This block MUST come before the gtag.js script below it. It sets Google Consent Mode v2
         to "denied" by default, which means the tag loads but stores no cookies and sends no
         identifiable data until src/components/CookieNotice.jsx calls gtag('consent','update')
         after someone presses Accept.

         Why it matters: without this, the site sets analytics cookies on every visitor the
         instant the page opens, with no notice and no way to say no. That is the thing Google
         flags, and it also made two lines of the privacy policy untrue.

         wait_for_update gives the banner half a second to read the saved choice before the tag
         decides, so a returning visitor who already accepted is not counted twice.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T871688R35"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-T871688R35', {
        send_page_view: false,
        anonymize_ip: true
      });
    </script>
